name: CivicFix CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Verify Environment Config
        working-directory: ./server
        run: |
          cp .env.example .env
          echo "MONGO_URI=mongodb://127.0.0.1:27017/civicfix" > .env
          echo "PORT=5000" >> .env
          echo "NODE_ENV=development" >> .env
          echo "JWT_SECRET=civicfix_jwt_super_secure_secret_key_2026_demo" >> .env
          echo "JWT_EXPIRES_IN=7d" >> .env
          echo "CLIENT_URL=http://localhost:5173" >> .env

      - name: Seed Database Test
        working-directory: ./server
        run: npm run seed

      - name: Run Backend Integration & Security Tests
        working-directory: ./server
        run: npm test

  client-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Production Vite Bundle
        working-directory: ./client
        run: npm run build
